<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalAI Workbench Dashboard</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#c9d1d9; --dim:#8b949e;
          --green:#3fb950; --red:#f85149; --yellow:#d29922; --blue:#58a6ff; --cyan:#39c5cf; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 Consolas,"Courier New",monospace; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:#010409;
           border-bottom:1px solid var(--border); position:sticky; top:0; z-index:9; }
  header h1 { font-size:15px; margin:0; color:var(--cyan); }
  header .sub { color:var(--dim); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .btn { background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:4px;
         padding:3px 10px; cursor:pointer; font:inherit; }
  .btn:hover { border-color:var(--blue); }
  main { display:grid; grid-template-columns: 1fr 1fr; gap:12px; padding:12px; }
  @media (max-width:900px){ main { grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:10px 12px; }
  .card h2 { margin:0 0 8px; font-size:13px; color:var(--dim); font-weight:600; }
  #events { height:340px; overflow-y:auto; font-size:12px; }
  .ev { white-space:pre-wrap; word-break:break-all; border-bottom:1px solid #21262d; padding:2px 0; }
  .ev .tag { display:inline-block; min-width:74px; color:var(--dim); }
  .ev.thinking  .tag { color:var(--dim); }
  .ev.toolcall  .tag { color:var(--blue); }
  .ev.toolresult .tag { color:var(--cyan); }
  .ev.routing  .tag { color:var(--yellow); }
  .ev.plan .tag { color:var(--yellow); }
  .ev.file .tag { color:var(--cyan); }
  .ev.final .tag, .ev.final { color:var(--green); }
  .ev.error .tag, .ev.error { color:var(--red); }
  .ev.fail { color:var(--red); }
  .ev.ok { color:var(--green); }
  .big { font-size:30px; font-weight:700; }
  .big.green { color:var(--green); } .big.red { color:var(--red); }
  .statrow { display:flex; justify-content:space-between; padding:2px 0; }
  .bar { background:#21262d; border-radius:3px; height:12px; margin:3px 0 8px; overflow:hidden; }
  .bar i { display:block; height:100%; }
  .b-green { background:var(--green); } .b-red { background:var(--red); } .b-yellow { background:var(--yellow); }
  .b-blue { background:var(--blue); } .b-dim { background:var(--dim); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { text-align:left; padding:3px 6px; border-bottom:1px solid #21262d; white-space:nowrap; }
  th { color:var(--dim); font-weight:600; }
  td.inp { max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ok { color:var(--green); } .fail { color:var(--red); } .warn { color:var(--yellow); }
  #tasksBody { display:block; max-height:260px; overflow-y:auto; }
  #backups { max-height:220px; overflow-y:auto; }
  .bk-task { cursor:pointer; padding:3px 6px; border-radius:3px; }
  .bk-task:hover { background:#21262d; }
  .bk-task.open { background:#1f3a2a; }
  .bk-file { padding-left:22px; cursor:pointer; color:var(--blue); }
  .bk-file:hover { text-decoration:underline; }
  .bk-meta { color:var(--dim); font-size:11px; margin-left:6px; }
  #diff { white-space:pre-wrap; font-size:12px; max-height:340px; overflow-y:auto; background:#0d1117;
          border:1px solid var(--border); border-radius:4px; padding:8px; }
  .d-hunk { color:var(--yellow); }
  .d-add { color:var(--green); } .d-del { color:var(--red); } .d-same { color:var(--dim); }
  .empty { color:var(--dim); padding:6px 0; }
</style>
</head>
<body>
<header>
  <h1>LocalAI Workbench</h1>
  <span class="sub" id="sub">加载中…</span>
  <button class="btn" onclick="refreshAll()">刷新</button>
</header>
<main>
  <div class="card" style="grid-column:1/-1">
    <h2>任务实时流（SSE · 当前任务）</h2>
    <div id="events"><div class="empty">等待任务事件…（dashboard 不阻塞 CLI，任务照常执行）</div></div>
  </div>

  <div class="card">
    <h2>统计（/api/stats）</h2>
    <div id="stats"><div class="empty">加载中…</div></div>
  </div>

  <div class="card">
    <h2>历史任务（/api/tasks · 最近 50）</h2>
    <div id="tasks"><div class="empty">加载中…</div></div>
  </div>

  <div class="card" style="grid-column:1/-1">
    <h2>工程备份与 Diff（/api/backups + /api/diff）</h2>
    <div id="backups"><div class="empty">加载中…</div></div>
    <div id="diff"><div class="empty">点击备份文件查看改动差异（红 = 删除，绿 = 新增）</div></div>
  </div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const cut = (s, n) => { s = String(s ?? ""); return s.length > n ? s.slice(0, n) + "…" : s; };
const fmtMs = (ms) => ms >= 1000 ? (ms / 1000).toFixed(1) + "s" : ms + "ms";

// ── SSE 实时流 ──
function openStream() {
  const es = new EventSource("/events");
  es.onmessage = (e) => {
    let evt; try { evt = JSON.parse(e.data); } catch { return; }
    const box = $("events");
    const cls = "ev " + (evt.type === "finalAnswer" ? "final" : evt.type === "error" ? "error" : evt.type);
    const text = evt.type === "toolCall"
      ? evt.name + " " + cut(JSON.stringify(evt.args), 200)
      : evt.type === "toolResultEvent"
      ? evt.name + (evt.success ? " [ok] " : " [fail] ") + cut(evt.output, 300)
      : evt.type === "routing" ? evt.serviceId + " ← " + evt.tier + (evt.intent ? " [" + evt.intent + "]" : "") + " · " + cut(evt.reason, 120)
      : evt.type === "planGenerated" ? "「" + cut(evt.summary, 120) + "」 " + (evt.filePaths || []).length + " files"
      : evt.type === "fileWritten" ? evt.path + " (" + evt.size + " chars)"
      : evt.type === "finalAnswer" ? cut(evt.text, 500)
      : cut(JSON.stringify(evt), 400);
    const tag = { finalAnswer:"完成", error:"错误", toolCall:"工具调用", toolResultEvent:"工具结果",
                  routing:"路由", thinking:"思考", planGenerated:"规划", fileWritten:"写文件" }[evt.type] || evt.type;
    const div = document.createElement("div");
    div.className = cls;
    div.innerHTML = `<span class="tag">${tag}</span> ${esc(text)}`;
    box.appendChild(div);
    while (box.children.length > 300) box.removeChild(box.firstChild);
    box.scrollTop = box.scrollHeight;
    $("sub").textContent = "运行目录：" + (evt.type === "toolCall" ? "任务执行中…" : "在线");
  };
  es.onerror = () => { /* 无任务事件时 SSE 保持连接；错误自动重连 */ };
}

// ── stats ──
async function fetchStats() {
  const r = await fetch("/api/stats");
  if (!r.ok) { $("stats").innerHTML = `<div class="empty">stats 不可用（${r.status}）</div>`; return; }
  const d = await r.json();
  const s = d.summary;
  const rateCls = s.successRate >= 0.8 ? "green" : s.successRate >= 0.5 ? "" : "red";
  let html = `<div class="statrow"><span>成功率</span><span class="big ${rateCls}">${(s.successRate * 100).toFixed(1)}%</span></div>`;
  html += `<div class="bar"><i class="b-green" style="width:${s.successRate * 100}%"></i></div>`;
  html += `<div class="statrow"><span>总任务</span><span>${s.totalCount}（成功 ${s.successCount} / 失败 ${s.failureCount} / 可疑 ${s.suspiciousCount}）</span></div>`;
  html += `<div class="statrow"><span>平均耗时</span><span>${fmtMs(s.avgTotalMs)}（修复 ${s.avgRetryCount.toFixed(2)} 次）</span></div>`;
  html += `<div class="statrow"><span>阶段耗时</span><span>规划 ${fmtMs(s.avgPlannerMs)} / 执行 ${fmtMs(s.avgExecutorMs)} / 验证 ${fmtMs(s.avgValidatorMs)}</span></div>`;
  if (d.epoch) {
    const c = d.epoch.current, l = d.epoch.legacy;
    html += `<div class="statrow" style="margin-top:6px"><span>agent_pro 时代隔离</span><span>30B ${(c.successRate*100).toFixed(1)}% (${c.count}) | 4B 历史 ${(l.successRate*100).toFixed(1)}% (${l.count})</span></div>`;
    html += `<div class="bar"><i class="b-blue" style="width:${c.successRate*100}%"></i><i class="b-dim" style="width:${l.successRate*100}%"></i></div>`;
  }
  if (d.failures && d.failures.length) {
    const max = Math.max(...d.failures.map(f => f.count), 1);
    html += `<div style="margin-top:6px"><span class="tag" style="color:var(--dim)">失败类别</span></div>`;
    for (const f of d.failures)
      html += `<div class="statrow"><span>${esc(f.category)}</span><span>${f.count}</span></div>
               <div class="bar"><i class="b-red" style="width:${(f.count / max * 100).toFixed(0)}%"></i></div>`;
  }
  $("stats").innerHTML = html;
}

// ── 历史任务 ──
async function fetchTasks() {
  const r = await fetch("/api/tasks?take=50");
  if (!r.ok) { $("tasks").innerHTML = `<div class="empty">tasks 不可用（${r.status}）</div>`; return; }
  const list = await r.json();
  if (!list.length) { $("tasks").innerHTML = `<div class="empty">暂无任务记录</div>`; return; }
  let html = `<table><thead><tr><th>时间</th><th>模式</th><th>服务</th><th>结果</th><th>耗时</th><th>输入</th></tr></thead><tbody id="tasksBody">`;
  for (const t of list) {
    const d = new Date(t.startedAt);
    const hm = d.toTimeString ? d.toTimeString().slice(0, 8) : "";
    const res = t.success ? `<span class="ok">OK</span>` : t.isSuspicious ? `<span class="warn">可疑</span>` : `<span class="fail">FAIL</span>`;
    html += `<tr><td>${hm}</td><td>${esc(t.mode)}</td><td>${esc(t.serviceId)}</td><td>${res}</td>
             <td>${fmtMs(t.totalMs)}</td><td class="inp" title="${esc(t.userInput)}">${esc(cut(t.userInput, 60))}</td></tr>`;
  }
  $("tasks").innerHTML = html + "</tbody></table>";
}

// ── 备份 + Diff ──
let backups = [];
async function fetchBackups() {
  const r = await fetch("/api/backups");
  if (!r.ok) { $("backups").innerHTML = `<div class="empty">backups 不可用（${r.status}）</div>`; return; }
  backups = await r.json();
  if (!backups.length) { $("backups").innerHTML = `<div class="empty">暂无工程备份（工程模式改动文件后出现）</div>`; return; }
  const byTask = {};
  for (const b of backups) (byTask[b.taskId] = byTask[b.taskId] || []).push(b);
  let html = "";
  for (const [taskId, files] of Object.entries(byTask)) {
    html += `<div class="bk-task" onclick="toggleTask('${taskId}', this)">▸ ${taskId} <span class="bk-meta">${files.length} 个文件</span></div>`;
    html += `<div class="bk-files" data-task="${taskId}" style="display:none">`;
    for (const f of files)
      html += `<div class="bk-file" onclick="showDiff('${taskId}', '${esc(f.rel).replace(/'/g, "\\'")}')">${esc(f.rel)} <span class="bk-meta">@{stamp}</span></div>`.replace("{stamp}", f.stamp);
    html += `</div>`;
  }
  $("backups").innerHTML = html;
}
function toggleTask(taskId, el) {
  const files = document.querySelector(`.bk-files[data-task="${taskId}"]`);
  const open = files.style.display !== "none";
  files.style.display = open ? "none" : "block";
  el.textContent = (open ? "▸" : "▾") + el.textContent.slice(1);
  el.classList.toggle("open", !open);
}
async function showDiff(taskId, rel) {
  $("diff").innerHTML = `<div class="empty">加载 diff…</div>`;
  const r = await fetch(`/api/diff?taskId=${encodeURIComponent(taskId)}&rel=${encodeURIComponent(rel)}`);
  if (!r.ok) { $("diff").innerHTML = `<div class="empty">diff 不可用（${r.status}）</div>`; return; }
  const d = await r.json();
  if (d.tooLarge) { $("diff").innerHTML = `<div class="empty">${esc(d.tooLargeReason)}</div>`; return; }
  if (!d.hunks || !d.hunks.length) { $("diff").innerHTML = `<div class="empty">无差异</div>`; return; }
  let html = "";
  for (const h of d.hunks) {
    html += `<div class="d-hunk">@@ -${h.oldStart},${h.oldCount} +${h.newStart},${h.newCount} @@</div>`;
    for (const ln of h.lines) {
      const sign = ln.type === "add" ? "+" : ln.type === "remove" ? "-" : " ";
      const num = ln.type === "add" ? ln.newNo : ln.type === "remove" ? ln.oldNo : `${ln.oldNo} ${ln.newNo}`;
      const cls = ln.type === "add" ? "d-add" : ln.type === "remove" ? "d-del" : "d-same";
      html += `<div class="${cls}">${sign} ${num}| ${esc(ln.text)}</div>`;
    }
  }
  $("diff").innerHTML = html;
}

function refreshAll() { fetchStats(); fetchTasks(); fetchBackups(); }
openStream();
refreshAll();
</script>
</body>
</html>
